<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ringtone Maker — ADP Voice Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0a17">
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
</head>
<body>
<div id="app-shell-root"></div>
<script src="app-shell.js"></script>
<script src="audio-engine.js"></script>
<script>
renderShell({ title: "Ringtone Maker", sub: "Gaane ka best part kaat kar smooth fade-in/out ke saath ringtone banayein." });

document.getElementById("page-content").insertAdjacentHTML("beforeend", `
  <div class="tool-panel">
    <div class="drop-zone" id="drop-zone">🔔 Click ya drag karke audio file yahan daalein</div>
    <input type="file" id="file-input" accept="audio/*" style="display:none;">
    <div class="status-line" id="status"></div>
    <audio id="src-audio" controls style="display:none;margin-top:10px;"></audio>

    <div class="row" style="margin-top:14px;">
      <div>
        <div class="field-label"><span>Start (seconds)</span></div>
        <input type="text" id="start-sec" value="0">
      </div>
      <div>
        <div class="field-label"><span>Duration (seconds, max 40)</span></div>
        <input type="text" id="dur-sec" value="20">
      </div>
    </div>

    <div class="btn-group">
      <button class="control-btn" id="btn-make">🔔 Make Ringtone</button>
      <button class="control-btn secondary" id="btn-download" disabled>⬇ Download Ringtone</button>
    </div>
    <div class="progress-bar" id="progress"><div></div></div>
    <audio id="preview" controls style="display:none;margin-top:10px;"></audio>
  </div>
`);

const dropZone = document.getElementById("drop-zone");
const fileInput = document.getElementById("file-input");
const statusEl = document.getElementById("status");
const srcAudio = document.getElementById("src-audio");
const preview = document.getElementById("preview");
const progress = document.getElementById("progress");
let currentFile = null, outBlob = null;

dropZone.addEventListener("click", () => fileInput.click());
dropZone.addEventListener("dragover", e => e.preventDefault());
dropZone.addEventListener("drop", e => { e.preventDefault(); if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]); });
fileInput.addEventListener("change", () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });
function setFile(f) {
  currentFile = f;
  statusEl.textContent = `Selected: ${f.name} (${fmtBytes(f.size)})`;
  srcAudio.src = URL.createObjectURL(f);
  srcAudio.style.display = "block";
}

document.getElementById("btn-make").addEventListener("click", async () => {
  if (!currentFile) { statusEl.textContent = "Pehle file choose karein."; return; }
  const start = parseFloat(document.getElementById("start-sec").value) || 0;
  const dur = Math.min(40, parseFloat(document.getElementById("dur-sec").value) || 20);

  statusEl.textContent = "Loading engine...";
  const ff = await getFFmpeg((pct) => setProgress(progress, pct));
  const inName = "input" + (currentFile.name.match(/\.\w+$/)?.[0] || ".mp3");
  ff.FS("writeFile", inName, await readFileAsUint8(currentFile));

  statusEl.textContent = "Creating ringtone with fade...";
  const fadeOutStart = Math.max(0, dur - 2);
  await ff.run(
    "-i", inName, "-ss", String(start), "-t", String(dur),
    "-af", `afade=t=in:st=0:d=1,afade=t=out:st=${fadeOutStart}:d=2`,
    "-acodec", "libmp3lame", "ringtone.mp3"
  );
  const data = ff.FS("readFile", "ringtone.mp3");
  outBlob = new Blob([data.buffer], { type: "audio/mp3" });
  preview.src = URL.createObjectURL(outBlob);
  preview.style.display = "block";
  document.getElementById("btn-download").disabled = false;
  statusEl.textContent = "Done!";
});

document.getElementById("btn-download").addEventListener("click", () => {
  if (outBlob) downloadBlob(outBlob, "ringtone.mp3");
});
</script>
</body>
</html>
