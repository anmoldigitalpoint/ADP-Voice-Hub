<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP4 to MP3 Converter — ADP Voice Hub</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0a17">
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
</head>
<body>
<div id="app-shell-root"></div>
<script src="app-shell.js"></script>
<script src="audio-engine.js"></script>
<script>
renderShell({ title: "MP4 to MP3 Converter", sub: "Video se sirf audio nikal ke MP3 banayein — free, poora conversion aapke device mein hi hota hai." });

document.getElementById("page-content").insertAdjacentHTML("beforeend", `
  <div class="tool-panel">
    <div class="drop-zone" id="drop-zone">🎬 Click ya drag karke MP4 file yahan daalein</div>
    <input type="file" id="file-input" accept="video/mp4,video/*" style="display:none;">
    <div class="status-line" id="status"></div>

    <div class="btn-group">
      <button class="control-btn" id="btn-convert">🎬 Convert to MP3</button>
      <button class="control-btn secondary" id="btn-download" disabled>⬇ Download MP3</button>
    </div>
    <div class="progress-bar" id="progress"><div></div></div>
    <audio id="preview" controls style="display:none;margin-top:10px;"></audio>
    <div class="hint">Bade video files (500MB+) ya purane mobile phones pe conversion thoda slow ho sakta hai — ye device ki processing power pe depend karta hai.</div>
  </div>
`);

const dropZone = document.getElementById("drop-zone");
const fileInput = document.getElementById("file-input");
const statusEl = document.getElementById("status");
const preview = document.getElementById("preview");
const progress = document.getElementById("progress");
let currentFile = null, outBlob = null;

dropZone.addEventListener("click", () => fileInput.click());
dropZone.addEventListener("dragover", e => e.preventDefault());
dropZone.addEventListener("drop", e => { e.preventDefault(); if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]); });
fileInput.addEventListener("change", () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });
function setFile(f) { currentFile = f; statusEl.textContent = `Selected: ${f.name} (${fmtBytes(f.size)})`; }

document.getElementById("btn-convert").addEventListener("click", async () => {
  if (!currentFile) { statusEl.textContent = "Pehle file choose karein."; return; }
  statusEl.textContent = "Loading engine (pehli baar thoda time lagega)...";
  const ff = await getFFmpeg((pct) => setProgress(progress, pct));

  ff.FS("writeFile", "input.mp4", await readFileAsUint8(currentFile));
  statusEl.textContent = "Converting to MP3...";
  await ff.run("-i", "input.mp4", "-vn", "-acodec", "libmp3lame", "-q:a", "2", "output.mp3");
  const data = ff.FS("readFile", "output.mp3");
  outBlob = new Blob([data.buffer], { type: "audio/mp3" });
  preview.src = URL.createObjectURL(outBlob);
  preview.style.display = "block";
  document.getElementById("btn-download").disabled = false;
  statusEl.textContent = "Done!";
});

document.getElementById("btn-download").addEventListener("click", () => {
  if (outBlob) downloadBlob(outBlob, "converted-audio.mp3");
});
</script>
</body>
</html>
