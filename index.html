<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADP Voice Hub — One Platform. Every Voice Tool.</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0a17">
<link rel="stylesheet" href="style.css">
<style>
  .hero{display:grid;grid-template-columns:1.1fr 0.9fr;gap:40px;align-items:center;padding:20px 0 40px;}
  .eyebrow{color:var(--purple);font-weight:700;font-size:0.8rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;}
  .hero h1{font-size:2.2rem;line-height:1.15;margin:0 0 14px;font-weight:800;}
  .hero h1 .accent{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .hero p{color:var(--muted);font-size:1rem;line-height:1.6;max-width:460px;margin-bottom:24px;}
  .btn-row{display:flex;gap:14px;flex-wrap:wrap;}
  .hero-visual{position:relative;height:260px;border-radius:24px;background:radial-gradient(circle at 50% 50%,#2a2260 0%,#12102a 70%);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .mic-glow{width:90px;height:120px;border-radius:45px;background:linear-gradient(180deg,#5c4bff,#2b2260);box-shadow:0 0 60px 10px rgba(124,92,255,0.45);}
  .bars{position:absolute;bottom:26px;left:0;right:0;display:flex;justify-content:center;gap:4px;opacity:.6;}
  .bars span{width:4px;background:var(--blue);border-radius:2px;animation:wave 1.4s ease-in-out infinite;}
  .bars span:nth-child(odd){animation-delay:.2s;background:var(--purple);}
  @keyframes wave{0%,100%{height:8px;}50%{height:38px;}}
  .tools-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .tool-card{border-radius:16px;padding:18px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid var(--border);position:relative;overflow:hidden;transition:transform .18s ease;}
  .tool-card:hover{transform:translateY(-4px);}
  .tool-card h3{margin:10px 0 4px;font-size:0.94rem;}
  .tool-card p{margin:0;color:rgba(255,255,255,0.75);font-size:0.76rem;line-height:1.35;}
  .tool-icon{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.16);display:flex;align-items:center;justify-content:center;font-size:1.1rem;}
  .tool-arrow{align-self:flex-end;width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,255,255,0.4);display:flex;align-items:center;justify-content:center;font-size:0.85rem;}
  .tc1{background:linear-gradient(160deg,#6d3ff0,#4a2ba8);} .tc2{background:linear-gradient(160deg,#2f6fe0,#1c4aa8);}
  .tc3{background:linear-gradient(160deg,#c5324b,#8a1f34);} .tc4{background:linear-gradient(160deg,#1f8a5a,#0f5c3a);}
  .tc5{background:linear-gradient(160deg,#d0782c,#8f4c15);} .tc6{background:linear-gradient(160deg,#7a4fd6,#4a2ba8);}
  .tc7{background:linear-gradient(160deg,#3f7ce0,#1c4aa8);} .tc8{background:linear-gradient(160deg,#b03a5a,#7a1f34);}
  .features{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:8px;}
  .feature{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--card);}
  .feature .ic{font-size:1.1rem;margin-bottom:6px;}
  .feature h4{margin:0 0 4px;font-size:0.84rem;color:var(--blue);}
  .feature p{margin:0;font-size:0.74rem;color:var(--muted);}
  @media(max-width:900px){.hero{grid-template-columns:1fr;} .tools-grid{grid-template-columns:repeat(2,1fr);} .features{grid-template-columns:repeat(2,1fr);}}
</style>
</head>
<body>
<div id="app-shell-root"></div>
<script src="app-shell.js"></script>
<script>
renderShell(null);

document.getElementById("page-content").insertAdjacentHTML("beforeend", `

    <a href="ringtone-maker.html" class="tool-card tc4"><div class="tool-icon">🔔</div><div><h3>Ringtone Maker</h3><p>Trim + fade for ringtones.</p></div><div class="tool-arrow">→</div></a>

  </div>

  <div style="margin-top:34px;" class="features">
    <div class="feature"><div class="ic">⚡</div><h4>Super Fast</h4><p>Runs in your browser.</p></div>
    <div class="feature"><div class="ic">🌍</div><h4>Hindi + English</h4><p>Both languages supported.</p></div>

    <div class="feature"><div class="ic">📱</div><h4>Works Everywhere</h4><p>Installable like an app.</p></div>
    <div class="feature"><div class="ic">🆓</div><h4>100% Free</h4><p>No signup, no hidden cost.</p></div>
  </div>
`);
</script>
</body>
</html>
